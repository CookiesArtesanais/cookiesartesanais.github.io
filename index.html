<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cookies Artesanais 🍪</title>
<link rel="icon" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<style>
body{margin:0;font-family:system-ui,sans-serif;background:#f6f0e4;color:#3b2314;text-align:center}
header{padding:0 0 10px} 
header img{width:100%;max-width:100%;height:auto;display:block}
h1{margin:16px 0 6px;font-size:1.6rem}
#aviso{display:none;background:#d62828;color:#fff;padding:14px;margin:12px;border-radius:12px;font-weight:600}
.info{font-size:.95rem;margin:4px 16px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px;padding:14px;max-width:960px;margin:auto}
.c{background:#fff;border-radius:16px;padding:10px;box-shadow:0 2px 8px #0002}.c img{width:100%;height:260px;object-fit:contain}
.p{font-size:1.4rem;font-weight:700;color:#d62828}.c small{display:block}
.btn{display:inline-block;background:#25d366;color:#fff;font-weight:700;padding:14px 26px;border-radius:30px;text-decoration:none;margin:18px}
.btn.off{background:#999;pointer-events:none}
/* Estilo para ajustar a exibição do QR Code */
.qrcode-pix{max-width:260px;width:100%;height:auto;display:block;margin:10px auto 30px;border-radius:12px;box-shadow:0 2px 8px #0002}
</style>
</head>
<body>
<header>
  <img src="logo.jpg" alt="Logo">
  <h1>Cookies Artesanais</h1>
  <div class="info">Feitos com amor, pra deixar seu dia mais doce 🐞</div>
  <div id="pausa" class="info" style="display:none;color:#d62828;font-size:1.12rem"><b>⚠️ Pedidos pausados nesta semana. ⚠️</b></div>
  <div class="info"><b>Pedidos até às 19 horas da quinta feira. Entrega na sexta-feira em Torres, local a combinar.</b></div>
</header>
<div class="grid" id="g"></div>
<a id="zap" class="btn" target="_blank" rel="noopener">💬 Fazer pedido no WhatsApp</a>

<!-- Imagem do QR Code adicionada logo abaixo do botão -->
<img src="qrcode.jpg" alt="Pix QR Code" class="qrcode-pix">

<script>
const ZAP="555198330025";
const M=[["Raffaello","raffaello",8,"Cookie com pedaços de chocolate ao leite e recheio de Creme de Raffaello (~100g)"],["Kinder Bueno","kinder",9,"Cookie com pedaços de chocolate ao leite, recheio de Creme de Kinder Bueno e pedaço de Kinder Bueno (~100g)"],["Ovomaltine","ovomaltine",8,"Cookie com pedaços de chocolate ao leite e recheio de Creme de Ovomaltine (~100g)"],["Creme de Avelã","avela",7,"Cookie com pedaços de chocolate ao leite e recheio de Creme de Avelã (~100g)"],["Brigadeiro de Ninho","ninho",7,"Cookie com pedaços de chocolate ao leite e chocolate branco e recheio de Brigadeiro caseiro de Leite Ninho (~100g)"],["Creme de Avelã (SEM GLÚTEN)","avelasemgluten",null,"Cookie com pedaços de chocolate ao leite e recheio de Creme de Avelã (~100g)"]];
const rs=v=>"R$ "+v.toFixed(2).replace(".",",");
g.innerHTML=M.map(m=>`<div class="c"><img src="${m[1]}.jpg" alt="${m[0]}"><h3>${m[0]}</h3><small>${m[3]}</small>${m[2]==null?'<div class="p" style="font-size:1.05rem">Consulte disponibilidade</div>':`<div class="p">${rs(m[2])} /un</div>`}</div>`).join("");
zap.href="https://wa.me/"+ZAP+"?text="+encodeURIComponent("Olá! Quero fazer um pedido de cookies 🍪");
const FB={p:"cookies-artesanais",k:"AIzaSyDnHbjUCg6CgE9OD4ZGoYoldtldEipIksI"};
function pausar(on){
 pausa.style.display=on?"block":"none";
 zap.classList.toggle("off",on);
 zap.textContent=on?"Pedidos pausados nesta semana":"💬 Fazer pedido no WhatsApp";
}
fetch(`https://firestore.googleapis.com/v1/projects/${FB.p}/databases/(default)/documents/publico/aviso?key=${FB.k}&t=${Date.now()}`,{cache:"no-store"})
 .then(r=>r.ok?r.json():null)
 .then(d=>pausar(!!(d&&d.fields&&d.fields.pausado&&d.fields.pausado.booleanValue===true)))
 .catch(()=>{});
</script>
</body>
</html>
