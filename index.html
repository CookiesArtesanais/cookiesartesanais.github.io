<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cookies Artesanais 🍪</title>
<link rel="icon" href="img/icon.png">
<link rel="apple-touch-icon" href="img/icon.png">
<style>
body{margin:0;font-family:system-ui,sans-serif;background:#f6f0e4;color:#3b2314;text-align:center}
header{padding:0 0 10px} 
header img{width:100%;max-width:100%;height:auto;display:block}
h1{margin:16px 0 6px;font-size:1.6rem}
#aviso{display:none;background:#d62828;color:#fff;padding:14px;margin:12px;border-radius:12px;font-weight:600}
.info{font-size:.95rem;margin:4px 16px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px;padding:14px;max-width:960px;margin:auto}
.c{background:#fff;border-radius:16px;padding:10px;box-shadow:0 2px 8px #0002}.c img{width:100%;height:260px;object-fit:contain}
.p{font-size:1.4rem;font-weight:700;color:#d62828}.c small{display:block}
.btn{display:inline-block;background:#25d366;color:#fff;font-weight:700;padding:14px 26px;border-radius:30px;text-decoration:none;margin:18px}
.btn.off{background:#999;pointer-events:none}
</style>
</head>
<body>
<header>
  <img src="img/logo.jpg" alt="Logo">
  <h1>Cookies Artesanais</h1>
  <div class="info">Feitos com amor, pra deixar seu dia mais doce 🐞</div>
  <div class="info"><b>Pedidos às quintas-feiras · Entregas às sextas-feiras</b></div>
</header>
<div id="aviso"></div>
<div class="grid" id="g"></div>
<a id="zap" class="btn" target="_blank" rel="noopener">💬 Fazer pedido no WhatsApp</a>
<script>
const ZAP="555100000000";
const M=[["Kinder Bueno","kinder",9,"Creme de Kinder Bueno + pedaços de chocolate ao leite + cobertura Kinder Bueno (~100g)"],["Ovomaltine","ovomaltine",8,"Creme de Ovomaltine + pedaços de chocolate ao leite + pitada de Ovomaltine (~100g)"],["Creme de Avelã","avela",7,"Creme de Avelã + pedaços de chocolate ao leite (~100g)"],["Brigadeiro de Ninho","ninho",7,"Creme de brigadeiro de Ninho + pedaços de chocolate ao leite (~100g)"],["Creme de Avelã Sem Glúten","avelasemgluten",null,"Cookie de Creme de Avelã + pedaços de chocolate ao leite, (~100g)"]];
const rs=v=>"R$ "+v.toFixed(2).replace(".",",");
g.innerHTML=M.map(m=>`<div class="c"><img src="img/${m[1]}.jpg" alt="${m[0]}"><h3>${m[0]}</h3><small>${m[3]}</small>${m[2]==null?'<div class="p" style="font-size:1.05rem">Consulte disponibilidade</div>':`<div class="p">${rs(m[2])} /un</div>`}</div>`).join("");
zap.href="https://wa.me/"+ZAP+"?text="+encodeURIComponent("Olá! Quero fazer um pedido de cookies 🍪");
fetch("aviso.json?"+Date.now()).then(r=>r.json()).then(a=>{
 if(a.aviso){aviso.textContent=a.aviso;aviso.style.display="block"}
 if(a.pausar){zap.classList.add("off");zap.textContent="Pedidos pausados nesta semana"}
}).catch(()=>{});
</script>
</body>
</html>
